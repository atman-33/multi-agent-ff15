name: shiritori-smoke-test
description: >
  低モデル agent のオペレーション遷移確認用。
  Noctis が開始し、Ignis、Gladiolus、Prompto が自分で考えた単語でしりとりを 1 手ずつ返して完了する。
  各 step は handoff の message に単語列を 1 語ずつ追記する。
initial_step: start

steps:
  - name: start
    agent: noctis
    job:
      file: ../facets/jobs/shiritori-player.md
    instruction:
      inline: |
        開始語を自分で 1 つ決める。
        ひらがなの短い名詞 1 語にする。
        「ん」で終わる語は使わない。
        report の message には開始語だけを書く。
        説明は書かない。
        開始できたら next は ignis-turn。
        開始できない場合だけ next は start-failed。
    rules:
      - condition: 開始語を決めて handoff message に書けた
        next: ignis-turn
      - condition: 開始語を決められなかった
        next: start-failed

  - name: start-failed
    agent: noctis
    job:
      inline: |
        しりとり開始失敗の報告だけを行う。
    instruction:
      inline: |
        しりとりの開始語を決められなかった。
        失敗したことだけを短く報告する。
        next は ABORT。
    rules:
      - condition: 開始失敗を報告した
        next: ABORT

  - name: ignis-turn
    agent: ignis
    job:
      file: ../facets/jobs/shiritori-player.md
    instruction:
      inline: |
        handoff の message にある単語列を読む。
        最後の単語の末尾から始まる新しい語を 1 つだけ自分で考える。
        ひらがなの短い名詞 1 語にする。
        既出語は使わない。
        「ん」で終わる語は使わない。
        report の message には単語列全体を ` -> ` 区切りで書き、新しい語を 1 語だけ末尾に追記する。
        説明は書かない。
        正常に続けられたら next は gladiolus-turn。
        続けられない場合だけ next は ABORT。
    rules:
      - condition: 単語列に 1 語追記して handoff message を作れた
        next: gladiolus-turn
      - condition: しりとりを続けられなかった
        next: ABORT

  - name: gladiolus-turn
    agent: gladiolus
    job:
      file: ../facets/jobs/shiritori-player.md
    instruction:
      inline: |
        handoff の message にある単語列を読む。
        最後の単語の末尾から始まる新しい語を 1 つだけ自分で考える。
        ひらがなの短い名詞 1 語にする。
        既出語は使わない。
        「ん」で終わる語は使わない。
        report の message には単語列全体を ` -> ` 区切りで書き、新しい語を 1 語だけ末尾に追記する。
        説明は書かない。
        正常に続けられたら next は prompto-turn。
        続けられない場合だけ next は ABORT。
    rules:
      - condition: 単語列に 1 語追記して handoff message を作れた
        next: prompto-turn
      - condition: しりとりを続けられなかった
        next: ABORT

  - name: prompto-turn
    agent: prompto
    job:
      file: ../facets/jobs/shiritori-player.md
    instruction:
      inline: |
        handoff の message にある単語列を読む。
        最後の単語の末尾から始まる新しい語を 1 つだけ自分で考える。
        ひらがなの短い名詞 1 語にする。
        既出語は使わない。
        「ん」で終わる語は使わない。
        report の message には完成した単語列全体を ` -> ` 区切りで書き、新しい語を 1 語だけ末尾に追記する。
        説明は書かない。
        正常に完了できたら next は COMPLETE。
        完了できない場合だけ next は ABORT。
    rules:
      - condition: 完成した単語列を作って完了した
        next: COMPLETE
      - condition: しりとりを完了できなかった
        next: ABORT