name: openspec-dev
description: >
  Guided OpenSpec delivery workflow.
  Noctis plans with User, Gladiolus implements and fixes issues, Ignis reviews, and Prompto performs the final refactor before completion.
initial_step: spec-planning

# --- Steps ---

steps:
  # 1. Noctis clarifies requirements with User and creates a spec plan
  - name: spec-planning
    agent: noctis
    job:
      file: ../facets/jobs/planner.md
    instruction:
      inline: |
        # Spec Planning — 手順指示

        この step では `.opencode/command/opsx-ff.md` を実行指示として使う。
        OpenSpec artifact の作成順、依存 artifact の参照、User への確認、完了条件はその記述に従うこと。
    knowledge:
      - file: ../facets/knowledge/agent-relationships.md
    output_contracts:
      report:
        - name: spec-plan.md
          format:
            file: ../facets/output-contracts/spec-plan.md
    rules:
      - condition: Open Spec artifact has been generated and approved
        next: implement

  # 2. Gladiolus implements based on the spec plan
  - name: implement
    agent: gladiolus
    job:
      file: ../facets/jobs/implementer.md
    instruction:
      inline: |
        # Implement — 手順指示

        `.opencode/command/opsx-apply.md` に従って実装する。
        開始前に `{{ output("spec-planning", "latest", "spec-plan.md") }}` を読み、frontmatter の `change_name` を OpenSpec change 名として使う。
        spec の参照は `change_path` を優先し、未設定なら `openspec/changes/<change_name>/` を使う。
        `change_name` / `change_path` を取得できない場合は blocked として報告する。
    policies:
      - file: ../facets/policies/coding-standards.md
    rules:
      - condition: Implementation complete and tests pass
        next: review
      - condition: Cannot proceed with implementation
        next: ABORT

  # 3. Ignis reviews the code (read-only, produces structured report)
  - name: review
    agent: ignis
    job:
      file: ../facets/jobs/reviewer.md
    instruction:
      inline: |
        # Review Code — 手順指示

        `.opencode/command/opsx-verify.md` に従って review する。
        開始前に `{{ output("spec-planning", "latest", "spec-plan.md") }}` を読み、frontmatter の `change_name` を verification 対象 change 名として使う。
        spec の参照は `change_path` を優先し、未設定なら `openspec/changes/<change_name>/` を使う。
        検証観点は `opsx-verify.md` に従うが、出力は `code-review` output contract の形式に合わせ、finding と verdict は policy に従って判定する。
        コードは変更しない。
    policies:
      - file: ../facets/policies/coding-standards.md
    output_contracts:
      report:
        - name: code-review.md
          format:
            file: ../facets/output-contracts/code-review.md
    rules:
      - condition: Approved — no blocking issues
        next: refactor
      - condition: Issues found — fix needed
        next: fix
      - condition: Critical problems — cannot proceed
        next: ABORT

  # 4. Gladiolus fixes issues found in review
  - name: fix
    agent: gladiolus
    job:
      file: ../facets/jobs/implementer.md
    instruction:
      inline: |
        # Fix Code — 手順指示

        `{{ output("review", "latest", "code-review.md") }}` の blocking finding を解消する。
        必要に応じて `{{ output("spec-planning", "latest", "spec-plan.md") }}` を読み、`change_name` / `change_path` から元 spec を再参照する。
        spec の参照は `change_path` を優先し、未設定なら `openspec/changes/<change_name>/` を使う。
        解消できない finding があれば理由付きで blocked または abort を報告する。
    policies:
      - file: ../facets/policies/coding-standards.md
    rules:
      - condition: All blocking issues fixed
        next: review
      - condition: Cannot fix — blocked
        next: ABORT

  # 5. Prompto performs the final cleanup after review approval
  - name: refactor
    agent: prompto
    job:
      file: ../facets/jobs/refactorer.md
    instruction:
      file: ../facets/instructions/simplify-code.md
    policies:
      - file: ../facets/policies/coding-standards.md
    rules:
      - condition: Refactoring complete
        next: COMPLETE
      - condition: No changes needed — code is already clean
        next: COMPLETE
