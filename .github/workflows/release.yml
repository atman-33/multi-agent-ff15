name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (e.g. 0.3.0)'
        required: true
        type: string

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Validate version format
        run: |
          VERSION="${{ github.event.inputs.version }}"
          if ! echo "$VERSION" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "❌ Invalid version format: '$VERSION'. Expected: X.Y.Z"
            exit 1
          fi
          echo "VERSION=$VERSION" >> $GITHUB_ENV
          echo "TAG=v$VERSION" >> $GITHUB_ENV

      - name: Check tag does not already exist
        run: |
          TAG="v${{ github.event.inputs.version }}"
          if git tag | grep -qx "$TAG"; then
            echo "❌ Tag $TAG already exists"
            exit 1
          fi

      - name: Verify version in package.json matches
        run: |
          PKG_VERSION=$(node -p "require('./package.json').version")
          INPUT_VERSION="${{ github.event.inputs.version }}"
          if [ "$PKG_VERSION" != "$INPUT_VERSION" ]; then
            echo "❌ package.json version ($PKG_VERSION) does not match input ($INPUT_VERSION)"
            exit 1
          fi

      - name: Extract release notes from CHANGELOG.md
        run: |
          VERSION="${{ github.event.inputs.version }}"
          NOTES=$(awk "/^## \[$VERSION\]/{found=1; next} found && /^## \[/{exit} found{print}" CHANGELOG.md)
          if [ -z "$NOTES" ]; then
            echo "❌ No entry found for version $VERSION in CHANGELOG.md"
            exit 1
          fi
          echo "$NOTES" > /tmp/release_notes.md
          echo "Release notes extracted ($(wc -l < /tmp/release_notes.md) lines)"

      - name: Create and push tag
        run: |
          TAG="v${{ github.event.inputs.version }}"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -a "$TAG" -m "Release $TAG"
          git push origin "$TAG"
          echo "✅ Tag $TAG created and pushed"

      - name: Create GitHub Release
        run: |
          TAG="v${{ github.event.inputs.version }}"
          gh release create "$TAG" \
            --title "Release $TAG" \
            --notes-file /tmp/release_notes.md \
            --verify-tag
          echo "✅ GitHub Release created: $TAG"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
