# Copy this file to builtins/<lang>/operations/<operation-name>.yaml or projects/<project-id>/operations/<operation-name>.yaml and replace every placeholder.
# For a rules-less Noctis autonomous delegation flow, start from autonomous-delegation-template.yaml instead of adapting this generic template.
# Keep facet paths relative to the operation file so `../facets/...` works in either source tree.
# Use exactly one of file or inline for each content source.
# initial_step must point to a noctis-owned step and that step must not route directly to COMPLETE or ABORT.
# If the initial step needs a failure or blocked branch, route it to a named non-initial step and let that later step choose COMPLETE or ABORT.
# Prefer the fewest steps that preserve ownership, required artifact boundaries, and explicit approvals or input waits.
# Do not add Noctis relay steps or User-facing progress-update steps unless checkpoints or approvals were explicitly requested.
# If another workflow already uses the same visible name, keep that duplication only when you intentionally want separate source-aware candidates and use description text to disambiguate.

name: <operation-name>
description: >
  <Summarize the workflow, participating agents, and expected step sequence.>
initial_step: plan

steps:
  - name: plan
    agent: noctis
    job:
      file: ../facets/jobs/<planner-job>.md
      # inline: |
      #   <Use inline only for step-local content.>
    instruction:
      file: ../facets/instructions/<plan-instruction>.md
      # inline: |
      #   # <Step title>
      #   1. <Action>
    skills:
      - file: ../facets/skills/<shared-skill>/SKILL.md
    policies:
      - file: ../facets/policies/<policy-file>.md
    output_contracts:
      report:
        - name: <plan-output>.md
          format:
            file: ../facets/output-contracts/<plan-output-contract>.md
    rules:
      - condition: <Planning complete>
        next: implement
    # If this initial step needs a failure path, route to a named non-initial step such as blocked instead of ABORT or COMPLETE.

  - name: implement
    agent: gladiolus
    job:
      file: ../facets/jobs/<implementer-job>.md
    instruction:
      inline: |
        # <Implementation step title>

        1. Read `{{ output("plan", "latest", "<plan-output>.md") }}` before starting.
        2. If the step output language must follow app settings, say so with `{{ setting("language", "name") }}` instead of asking the agent to read `config/settings.yaml` manually.
        3. If the instructions need explicit filesystem roots, use `{{ root("app_root") }}` for app-owned paths and `{{ root("execution_root") }}` for the mission execution target instead of relying on `<tooling-context>` prose.
        4. <Implement the required change.>
        5. If blocked, report why and include the recommended next action.
    policies:
      - file: ../facets/policies/<policy-file>.md
    rules:
      - condition: <Implementation complete>
        next: COMPLETE
      - condition: <Blocked>
        next: ABORT

# Duplicate and adapt step blocks as needed.
# Optional non-initial blocker example for an initial-step failure path:
#  - name: blocked
#    agent: noctis
#    instruction:
#      inline: |
#        <Explain the blocker or failed precondition.>
#    rules:
#      - condition: <Abort confirmed>
#        next: ABORT
# This generic template assumes normal rule-driven step transitions.
# Keep User-facing messaging at the end unless the workflow explicitly needs checkpoints or is blocked on User input.
# Valid agent values in this repository are noctis, ignis, gladiolus, and prompto.