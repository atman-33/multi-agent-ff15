# Model IDs and their corresponding OpenCode switching keywords
model_definitions:
  github-copilot/claude-haiku-4.5: "Claude Haiku 4.5"
  github-copilot/claude-sonnet-4.6: "Claude Sonnet 4.6"
  github-copilot/claude-opus-4.6: "Claude Opus 4.6"
  github-copilot/gpt-5.2-codex: "GPT-5.2-Codex"
  github-copilot/gpt-5.3-codex: "GPT-5.3-Codex"
  github-copilot/gpt-5.4: "GPT-5.4"
  github-copilot/gemini-3-flash-preview: "Gemini 3 Flash"
  github-copilot/gemini-3.1-pro-preview: "Gemini 3.1 Pro Preview"
  github-copilot/gpt-5-mini: "GPT-5-mini"
  opencode/minimax-m2.5-free: "MiniMax M2.5 Free"
  opencode/trinity-large-preview-free: "Trinity Large Preview"

# Model configuration by mode
# Each agent has: model (OpenCode model ID), agent (optional, for future use)
# Comrades: ignis, gladiolus, prompto / Independent: lunafreya / Guardian: iris
# _description: Mode description shown in help text and startup banner
modes:
  normal:
    _description: Standard configuration
    noctis:
      model: github-copilot/claude-sonnet-4.6
    ignis:
      model: github-copilot/claude-sonnet-4.6
    gladiolus:
      model: github-copilot/gpt-5.2-codex
    prompto:
      model: github-copilot/gemini-3.1-pro-preview
    lunafreya:
      model: github-copilot/claude-sonnet-4.6
    iris:
      model: github-copilot/gpt-5-mini

  fullpower:
    _description: High-performance configuration
    noctis:
      model: github-copilot/claude-opus-4.6
    ignis:
      model: github-copilot/claude-opus-4.6
    gladiolus:
      model: github-copilot/claude-opus-4.6
    prompto:
      model: github-copilot/claude-opus-4.6
    lunafreya:
      model: github-copilot/claude-sonnet-4.6
    iris:
      model: github-copilot/gpt-5-mini

  lite:
    _description: Low-cost configuration
    noctis:
      model: github-copilot/claude-haiku-4.5
    ignis:
      model: github-copilot/claude-haiku-4.5
    gladiolus:
      model: github-copilot/gemini-3-flash-preview
    prompto:
      model: github-copilot/gemini-3-flash-preview
    lunafreya:
      model: github-copilot/claude-haiku-4.5
    iris:
      model: github-copilot/gpt-5-mini

  free:
    _description: Free (minimax-m2.5-free)
    noctis:
      model: opencode/minimax-m2.5-free
    ignis:
      model: opencode/minimax-m2.5-free
    gladiolus:
      model: opencode/minimax-m2.5-free
    prompto:
      model: opencode/minimax-m2.5-free
    lunafreya:
      model: opencode/minimax-m2.5-free
    iris:
      model: github-copilot/gpt-5-mini

  gpt5mini:
    _description: All agents use GPT-5 Mini
    noctis:
      model: github-copilot/gpt-5-mini
    ignis:
      model: github-copilot/gpt-5-mini
    gladiolus:
      model: github-copilot/gpt-5-mini
    prompto:
      model: github-copilot/gpt-5-mini
    lunafreya:
      model: github-copilot/gpt-5-mini
    iris:
      model: github-copilot/gpt-5-mini
